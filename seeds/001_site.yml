site:
  language: "en"
  settings:
    # Site logo (theme asset: assets/images/logo.png)
    logo_url: "images/logo.png"

    # Feedback form and visit count (defaults match settings_schema.json)
    is_allow_feedback: true
    is_show_visit_count: true
    is_allow_header: true
    is_allow_footer: true

    # Custom HTML snippets
    head_html: |
      <!-- Demo: analytics or meta tags go here -->
    header_menu_html: |
      <a href="/" class="hover:underline">Home</a>
      <a href="/s/recent" class="hover:underline">Recent</a>
      <a href="/s/tags" class="hover:underline">Tags</a>
      <a href="/s/brand" class="hover:underline">Brand</a>
      <a href="/s/about" class="hover:underline">About</a>
    footer_menu_html: |
      <a href="/" class="text-white hover:underline">Back to site</a>
      <a href="/s/about" class="text-white hover:underline">Theme guide</a>
      <a href="https://www.baklib.cn" class="text-white hover:underline" target="_blank" rel="noopener noreferrer">Baklib</a>

    # Site tags (`site.tags`) are NOT stored in theme settings.
    # Create tags in admin or via API, then attach them on articles with the page template tag picker.
    # Demo tag names used in seeds/002_pages.yml: Blog, News, Announcement, Notice, Tutorial
